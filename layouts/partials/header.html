<header class="site-header">
  <a class="site-name" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
  <nav>
    {{ range .Site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}
    {{- /* Label and handler are set by the script in head.html, which is the
           only place that knows the effective theme. These attributes are the
           pre-script default. */}}
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme">dark</button>
  </nav>
</header>
