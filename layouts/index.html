{{ define "main" }}
<article>
  <h1>Writing</h1>
  {{ range (where .Site.RegularPages "Section" "posts").GroupByDate "2006" }}
    <h2 class="year-heading">{{ .Key }}</h2>
    <ul class="post-list">
      {{ range .Pages }}
        <li>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02" }}</time>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  {{ end }}
</article>
{{ end }}
