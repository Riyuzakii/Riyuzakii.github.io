baseURL = "https://riyuzakii.github.io/"
locale = "en-us"
title = "Aditya Rohan"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[permalinks]
  posts = "/:slug/"

[params]
  description = "Notes on what I've been working on."

[services.rss]
  limit = 20

# Hugo's built-in RSS output format is plain text (no HTML-escaping) by
# default, but that default is lost once layouts/index.rss.xml overrides
# the home page's RSS template — without this, the custom template gets
# rendered through html/template and the feed's leading "<?xml ...?>" is
# HTML-entity-escaped into "&lt;?xml ...?>", corrupting the XML. Re-declare
# it explicitly so the feed stays well-formed.
[outputFormats.RSS]
  isPlainText = true

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  lineNos = false
  tabWidth = 2

[[menu.main]]
  name = "writing"
  url = "/"
  weight = 1

[[menu.main]]
  name = "about"
  url = "/about/"
  weight = 2
